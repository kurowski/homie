[user]
name  = "{{ .Name }}"
email = "{{ .Email }}"

[profile]
name          = "{{ .Profile }}"
default_shell = "{{ .DefaultShell }}"

[packages]
# Packages installed on every supported platform.
all = ["git", "zsh", "neovim", "tmux", "ripgrep", "fzf"]

# Per-platform lists, merged onto `all`. fd ships under two different
# names depending on the platform — that's exactly what these keys are
# for. Add anything else platform-specific here:
#   fedora = ["dejavu-sans-mono-fonts"]
#   ubuntu = ["fonts-dejavu"]
ubuntu = ["fd-find"]
debian = ["fd-find"]
fedora = ["fd-find"]
arch   = ["fd"]
macos  = ["fd"]
termux = ["fd"]

[tags]
# Auto tags from environment detection (distro, arch, container, root,
# profile name) are added automatically. Anything else you want to
# branch on in templates goes here.
extra = []

[vars]
# Exposed to templates as {{`{{ .Vars.NAME }}`}} and to scripts as
# environment variables.
EDITOR = "nvim"
